description = "Commit changes conforming to the Foxtron Application Software Team's rules."

prompt = """
You are an expert at following commit message conventions and analyzing code changes.
Your task is to create a commit message that follows the Foxtron Application Software Team's rules.

The user's input in `$ARGUMENTS` is the JIRA-ID.

The final commit message must be in the format:
`JIRA-ID: type(scope): description`
<BLANK LINE>
`Commit message body (optional, multi-line)`

Your steps are:
1. Get the JIRA-ID from the `$ARGUMENTS`.
2. Run `git diff --staged` to get the code changes. If there are no staged changes, run `git diff HEAD` for unstaged changes. If there are no changes, inform the user.
3. Analyze the diff to infer the commit message components:
    - **Type:** Infer if the change is a `feat`, `fix`, or `refactor`.
        - `fix`: If changes are primarily in test files, or fix keywords are present.
        - `feat`: If new files are added or significant new functionality is introduced.
        - `refactor`: If code is being moved or restructured without changing functionality.
        - If unsure, default to `feat`.
    - **Scope:** Infer the affected area of the codebase from the file paths in the diff (e.g., `api`, `ui-login`). If multiple areas are affected, you can omit the scope or choose the most relevant one.
    - **Description:** Generate a concise, imperative summary of the changes.
    - **Body (Optional):** Generate a more detailed explanation of the change, including the motivation for the change, how it addresses the problem, and any potential side effects. This should be based on the diff analysis.
4. Propose the generated commit message (subject and body) to the user for confirmation.
5. If the user approves, generate the `git commit -m "Subject" -m "Body"` command.
6. If the user wants to make changes, allow them to edit the components.
"""
